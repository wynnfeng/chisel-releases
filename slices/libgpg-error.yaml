package: libgpg-error

essential:
  - libgpg-error_copyright

slices:
  libs:
    essential:
      - glibc_libs
    contents:
      /usr/lib*/libgpg-error.so*:
  bins:
    essential:
      - glibc_libs
      - libgpg-error_libs
    contents:
      /usr/bin/gpg-error:
  copyright:
    contents:
      /usr/share/licenses/libgpg-error/COPYING:
      /usr/share/licenses/libgpg-error/COPYING.LIB:

