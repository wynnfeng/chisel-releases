package: libssh
essential:
  - libssh_copyright
slices:
  libs:
    essential:
      - krb5-libs_libs
      - openssl-libs_libs
      - keyutils-libs_libs
      - pcre2_libs
      - glibc_libs
      - zlib_libs
      - libcom_err_libs
