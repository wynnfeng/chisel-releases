package: glibc

essential:
  - glibc_copyright

slices:
  config:
    contents:
      /etc/ld.so.conf.d:

  libs:
    essential:
      # Although not declared as a dependency in the libc6 deb, base-files is
      # an essential package assumed to already exist as a core part of the distro.
      # In this case, libc6 clearly depends on the library paths set by base-files
      # and as such, we create this explicit dependency between the two slices.
      # Ref: https://github.com/canonical/chisel-releases/pull/171
      - filesystem_libs
    contents:
      /lib*/ld*.so.*:
      /lib*/libBrokenLocale.so.*:
      /lib*/libanl.so.*:
      /lib*/libc.so.*:
      /lib*/libc_malloc_debug.so.*:
      /lib*/libdl.so.*:
      /lib*/libm.so.*:
      /usr/lib*/libmemusage.so:
      /lib*/libmvec.so.*: {arch: [x86_64, aarch64]}
      /lib*/libnsl.so.1:
      /lib*/libnss_compat.so.*:
      /lib*/libnss_dns.so.*:
      /lib*/libnss_files.so.*:
      #/lib*/libnss_hesiod.so.*:
      /usr/lib*/libpcprofile.so:
      /lib*/libpthread.so.*:
      /lib*/libresolv.so.*:
      /lib*/librt.so.*:
      /lib*/libthread_db.so.*:
      /lib*/libutil.so.*:

  gconv:
    contents:
      /usr/lib*/gconv/**:

  copyright:
    contents:
      /usr/share/licenses/glibc/**: