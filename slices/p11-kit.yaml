package: p11-kit

essential:
  - p11-kit_copyright

slices:
  bins:
    essential:
      - glibc_libs
      - p11-kit_libs
      - libtasn1_libs
      - p11-kit-trust_config
      - p11-kit-trust_libs
    contents:
      /usr/bin/p11-kit:
      /usr/libexec/p11-kit/p11-kit-remote:
  libs:
    essential:
      - glibc_libs
      - libffi_libs
    contents:
      /usr/lib*/libp11-kit.so.0*:
      /usr/lib*/p11-kit-proxy.so:
  copyright:
    contents:
      /usr/share/licenses/p11-kit/COPYING:
