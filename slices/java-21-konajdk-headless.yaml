package: java-21-konajdk-headless

essential:
  - java-21-konajdk-headless_copyright

slices:
  # A set of slices to run headless konajdk runtime
  standard:
    essential:
      - java-21-konajdk-headless_class-data-sharing
      - java-21-konajdk-headless_console
      - java-21-konajdk-headless_core
      - java-21-konajdk-headless_debug
      - java-21-konajdk-headless_jfr
      - java-21-konajdk-headless_management
      - java-21-konajdk-headless_prefs
      - java-21-konajdk-headless_rmi
      - java-21-konajdk-headless_security
      - java-21-konajdk-headless_tools

  # List of classes required to create the Class Data Sharing archive
  class-data-sharing:
    essential:
      - java-21-konajdk-headless_core
    contents:
        /usr/lib/jvm/java-21-konajdk-*/lib/classlist:

  # A minimal set of files to run a Java application
  # excluded dependencies:
  # - ca-certificates-java_essential - needs chisel support to run
  #                                    maintainer scripts.
  # - java-common                    - provides update-alternatives,
  #                                    not relevant.
  # - util-linux                     - needed for bash completion
  #                                    not relevant.
  # - libjpeg8                       - used in awt, not relevant
  # - liblcms2-2                     - used in awt, not relevant
  core:
    essential:
      - glibc_libs
      - libgcc_libs
      - libstdc++_libs
      - zlib_libs
    contents:
        /etc/java/java-21-konajdk/java-21-konajdk*/conf/jaxp.properties:
        /etc/java/java-21-konajdk/java-21-konajdk*/conf/logging.properties:
        /etc/java/java-21-konajdk/java-21-konajdk*/conf/net.properties:
        /etc/java/java-21-konajdk/java-21-konajdk*/conf/security/java.policy:
        /etc/java/java-21-konajdk/java-21-konajdk*/conf/security/java.security:
        /usr/lib/jvm/java-21-konajdk-*/bin/java:
        /usr/lib/jvm/java-21-konajdk-*/conf:
        /usr/lib/jvm/java-21-konajdk-*/conf/jaxp.properties:
        /usr/lib/jvm/java-21-konajdk-*/conf/logging.properties:
        /usr/lib/jvm/java-21-konajdk-*/conf/net.properties:
        /usr/lib/jvm/java-21-konajdk-*/conf/security/java.policy:
        /usr/lib/jvm/java-21-konajdk-*/conf/security/java.security:
        /usr/lib/jvm/java-21-konajdk-*/lib/jexec:
        /usr/lib/jvm/java-21-konajdk-*/lib/jspawnhelper:
        /usr/lib/jvm/java-21-konajdk-*/lib/jvm.cfg:
        /usr/lib/jvm/java-21-konajdk-*/lib/libextnet.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libjava.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libjimage.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libjli.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libjsig.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libnet.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libnio.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libverify.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libzip.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/modules:
        /usr/lib/jvm/java-21-konajdk-*/lib/server/libjsig.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/server/libjvm.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/tzdb.dat:

  # Native part of jdk.prefs modules
  prefs:
    essential:
      - java-21-konajdk-headless_core
    contents:
        /usr/lib/jvm/java-21-konajdk-*/lib/libprefs.so:

  # Native part of java.rmi
  rmi:
    essential:
      - java-21-konajdk-headless_security
    contents:
        /usr/lib/jvm/java-21-konajdk-*/bin/rmiregistry:
        /usr/lib/jvm/java-21-konajdk-*/lib/librmi.so:

  # Native part of the console support
  console:
    essential:
      - java-21-konajdk-headless_core
    contents:
        /usr/lib/jvm/java-21-konajdk-*/lib/lible.so:

  # Debug support
  debug:
    essential:
      - java-21-konajdk-headless_core
    contents:
        /usr/lib/jvm/java-21-konajdk-*/lib/libattach.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libdt_socket.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libinstrument.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libjdwp.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libsaproc.so:

  # Configuration and native part of Java Management Extensions
  management:
    essential:
      - java-21-konajdk-headless_rmi
    contents:
        /etc/java/java-21-konajdk/java-21-konajdk-*/conf/management/jmxremote.access:
        /etc/java/java-21-konajdk/java-21-konajdk-*/conf/management/management.properties:
        /usr/lib/jvm/java-21-konajdk-*/conf/management/jmxremote.access:
        /usr/lib/jvm/java-21-konajdk-*/conf/management/management.properties:
        /usr/lib/jvm/java-21-konajdk-*/lib/libmanagement.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libmanagement_agent.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libmanagement_ext.so:

  # Security configuration files and native libraries
  security:
    essential:
      - nss_libnss
      - pcsc-lite-libs_libs
      - java-21-konajdk-headless_core
    contents:
        /etc/java/java-21-konajdk/java-21-konajdk-*/lib/security/blocked.certs:
        /etc/java/java-21-konajdk/java-21-konajdk-*/lib/security/default.policy:
        /etc/java/java-21-konajdk/java-21-konajdk-*/conf/security/nss.cfg:
        /etc/java/java-21-konajdk/java-21-konajdk-*/conf/security/policy/limited/default_US_export.policy:
        /etc/java/java-21-konajdk/java-21-konajdk-*/conf/security/policy/limited/default_local.policy:
        /etc/java/java-21-konajdk/java-21-konajdk-*/conf/security/policy/limited/exempt_local.policy:
        /etc/java/java-21-konajdk/java-21-konajdk-*/conf/security/policy/unlimited/default_US_export.policy:
        /etc/java/java-21-konajdk/java-21-konajdk-*/conf/security/policy/unlimited/default_local.policy:
        /etc/java/java-21-konajdk/java-21-konajdk-*/conf/lib/security/public_suffix_list.dat:
        /usr/lib/jvm/java-21-konajdk-*/conf/security/nss.cfg:
        /usr/lib/jvm/java-21-konajdk-*/conf/security/policy/limited/default_US_export.policy:
        /usr/lib/jvm/java-21-konajdk-*/conf/security/policy/limited/default_local.policy:
        /usr/lib/jvm/java-21-konajdk-*/conf/security/policy/limited/exempt_local.policy:
        /usr/lib/jvm/java-21-konajdk-*/conf/security/policy/unlimited/default_US_export.policy:
        /usr/lib/jvm/java-21-konajdk-*/conf/security/policy/unlimited/default_local.policy:
        /usr/lib/jvm/java-21-konajdk-*/lib/libj2gss.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libj2pcsc.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libj2pkcs11.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/libjaas.so:
        /usr/lib/jvm/java-21-konajdk-*/lib/security/blocked.certs:
        /usr/lib/jvm/java-21-konajdk-*/lib/security/cacerts:
        /usr/lib/jvm/java-21-konajdk-*/lib/security/default.policy:
        /usr/lib/jvm/java-21-konajdk-*/lib/security/public_suffix_list.dat:

  # konajdk tools
  tools:
    essential:
      - java-21-konajdk-headless_security
    contents:
        /usr/lib/jvm/java-21-konajdk-*/bin/keytool:

  # Java Flight Recorder configuration and jar file
  jfr:
    essential:
      - java-21-konajdk-headless_core
    contents:
        /usr/lib/jvm/java-21-konajdk-*/lib/jfr/default.jfc:
        /usr/lib/jvm/java-21-konajdk-*/lib/jfr/profile.jfc:
        /usr/lib/jvm/java-21-konajdk-*/lib/jrt-fs.jar:

  copyright:
    contents:
        /usr/lib/jvm/java-21-konajdk-21*/legal/java.base/LICENSE: