package: p11-kit-trust

slices:
  bins:
    essential:
      - glibc_libs
      - p11-kit_libs
      - libtasn1_libs
      - p11-kit-trust_config
    contents:
      /usr/bin/trust:
      /usr/libexec/p11-kit/trust-extract-compat:
  libs:
    essential:
      - glibc_libs
      - libffi_libs
      - p11-kit_libs
      - libtasn1_libs
    contents:
      /usr/lib64/pkcs11/p11-kit-trust.so:

  config:
    contents:
      /usr/share/p11-kit/modules/p11-kit-trust.module: