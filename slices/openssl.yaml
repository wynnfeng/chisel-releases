package: openssl

essential:
  - openssl_copyright

slices:
  bins:
    essential:
      - glibc_config
      - glibc_libs
      - openssl-libs_libs
      - openssl_config
      - openssl_data
    contents:
      /usr/bin/openssl:

  config:
    contents:
      /etc/ssl/openssl.cnf:
      /etc/ssl/certs:
      /etc/pki/tls/certs:
      /etc/pki/tls/openssl.cnf:

  data:
    contents:
      /etc/ssl/cert.pem:
      /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:


  copyright:
    contents:
      /usr/share/doc/openssl/copyright:
