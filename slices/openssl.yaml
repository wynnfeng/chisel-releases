package: openssl

essential:
  - openssl_copyright

slices:
  bins:
    essential:
      - glibc_libs
      - openssl-libs_libs
      - openssl_config
      - crypto-policies_openssl
    contents:
      /usr/bin/openssl:

  config:
    essential:
      - ca-certificates_data

  copyright:
    contents:
      /usr/share/licenses/openssl/LICENSE.txt:
