package: filesystem

essential:
  - filesystem_copyright

slices:
  base:
    essential:
      - filesystem_bin
      - filesystem_etc
      - filesystem_home
      - filesystem_libs
      - filesystem_tmp
      - filesystem_var

  etc:
    contents:
      /etc/:

  bin:
    contents:
      /usr/bin/:
      /usr/sbin/:
      /bin/:
      /sbin/:

  libs:
    contents:
      /usr/lib/:
      /usr/lib64/: {arch: [x86_64, aarch64]}
      /lib64/:
      /lib/:

  tmp:
    contents:
      /tmp/:

  var:
    contents:
      /run/:
      /var/cache/:
      /var/lib/:
      /var/log/:
      # The /var/run symlink is enforced by the package's maintainer scripts
      /var/run/: {symlink: /run}
      /var/tmp/:

  home:
    contents:
      /home/:
      /root/:

  release-info:
    essential:
      - filesystem_etc
      - filesystem_libs
      - setup_hostdata
    contents:
      /etc/opencloudos-stream-release:
      /etc/issue:
      /etc/issue.net:
      /etc/os-release:
      /usr/lib/os-release:

  # Dedicated slice for generating the Chisel manifest.
  chisel:
    essential:
      - filesystem_var
    contents:
      /var/lib/chisel/**: {generate: manifest}

  copyright:
    contents:
      /usr/share/licenses/: