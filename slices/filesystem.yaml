package: filesystem

essential:
  - filesystem_copyright
  - tencentos-release_etc

slices:
  base:
    essential:
      - filesystem_bin
      - filesystem_etc
      - filesystem_home
      - filesystem_libs
      - filesystem_tmp
      - filesystem_var

  etc:
    contents:
      /etc/:

  bin:
    contents:
      /usr/bin/:
      /usr/sbin/:
      /bin/:
      /sbin/:

  libs:
    contents:
      /usr/lib/:
      /usr/lib64/: {arch: [x86_64, aarch64]}
      /lib64/:
      /lib/:

  tmp:
    contents:
      /tmp/:

  var:
    contents:
      /run/:
      /var/cache/:
      /var/lib/:
      /var/log/:
      # The /var/run symlink is enforced by the package's maintainer scripts
      /var/run/: {symlink: /run}
      /var/tmp/:

  home:
    contents:
      /home/:
      /root/:

  copyright:
    contents:
      /usr/share/licenses/: