package: krb5-libs
essential:
  - krb5-libs_copyright
slices:
  libs:
    essential:
      - krb5-libs_support
      - krb5-libs_crypto
      - krb5-libs_libkrb5
      - krb5-libs_gssapi

  support:
    essential:
      - glibc_libs
    contents:
      /usr/lib64/libkrb5support.so*:
  crypto:
    deps:
      - glibc_libs
      - krb5-libs_support
    contents:
        /usr/lib64/libk5crypto.so.*:
  libkrb5:
    essential:
      - glibc_libs
      - libcom_err_libs
      - krb5-libs_crypto
      - keyutils-libs_libs
      - krb5-libs_support
      - openssl-libs_libs
    contents:
        /usr/lib64/krb5/plugins/libkrb5/:
        /usr/lib64/krb5/plugins/preauth/spake.so:
        /usr/lib64/libkrb5.so.*:
  gssapi:
    essential:
      - glibc_libs
      - libcom_err_libs
      - krb5-libs_crypto
      - krb5-libs_libkrb5
      - krb5-libs_support
    contents:
        /usr/lib64/libgssapi_krb5.so.*:
  copyright:
    contents:
      /usr/share/licenses/krb5-libs/NOTICE:
