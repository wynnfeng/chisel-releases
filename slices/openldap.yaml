package: openldap
essential:
  - openldap_copyright
slices:
  libs:
    essential:
      - libevent_libs
      - openssl-libs_libs
      - libxcrypt_libs
      - cyrus-sasl-lib_libs
      - glibc_libs
      - zlib_libs
